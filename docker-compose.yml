services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurantos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/restaurantos
      PORT: "4000"
      FRONTEND_URL: "http://localhost:5173"
      JWT_SECRET: "change-this-in-production"
    depends_on:
      - db

volumes:
  pgdata:
